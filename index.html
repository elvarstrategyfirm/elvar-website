<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elvar Strategy Firm</title>
<meta name="description" content="Elvar Strategy Firm — performance mindset coaching for athletes and leadership development for business. Understand Yourself. Perform Better.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #262626;
    --gold: #C9A84C;
    --white: #FFFFFF;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    align-items: center;
  }

  .divider {
    width: 1px;
    height: 50%;
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,.55), transparent);
    align-self: center;
  }

  .side {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 320px;
    text-decoration: none;
    color: inherit;
    position: relative;
    outline: none;
  }
  /* soft gold glow behind the logo on hover */
  .side::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(201,168,76,.10), transparent 55%);
    opacity: 0;
    transition: opacity .4s ease;
  }
  .side:hover::before, .side:focus-visible::before { opacity: 1; }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .35s ease;
    animation: rise .9s ease both;
  }
  .side:nth-child(3) .logo { animation-delay: .12s; }
  .side:hover .logo, .side:focus-visible .logo { transform: translateY(-4px) scale(1.03); }

  .wordmark {
    font-weight: 900;
    font-size: clamp(56px, 8.2vw, 128px);
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .wordmark .v { color: var(--gold); }

  .tag {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.1vw, 16px);
    margin-top: clamp(14px, 1.6vw, 26px);
    width: 100%;
  }
  .tag .line {
    flex: 1;
    height: 3px;
    background: var(--gold);
  }
  .tag .word {
    font-weight: 600;
    font-size: clamp(18px, 2vw, 30px);
    letter-spacing: 0.42em;
    margin-right: -0.42em; /* balance trailing letter-spacing */
  }

  .enter {
    margin-top: 28px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .side:hover .enter, .side:focus-visible .enter { opacity: 1; transform: none; }

  footer {
    text-align: center;
    padding: 18px 16px 22px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .05em;
  }
  footer a { color: var(--muted); text-decoration: none; margin: 0 10px; }
  footer a:hover { color: var(--gold); }
  .credit { margin-top: 8px; font-size: 10px; color: #6b6b6b; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* Phones: stack the two logos */
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; grid-template-rows: 1fr auto 1fr; }
    .divider {
      width: 50%; height: 1px; justify-self: center;
      background: linear-gradient(to right, transparent, rgba(201,168,76,.55), transparent);
    }
    .side { min-height: 38vh; }
    .wordmark { font-size: 64px; }
    .tag .word { font-size: 18px; }
    .enter { opacity: 1; transform: none; margin-top: 18px; }
  }
</style>
</head>
<body>
  <main class="split">
    <a class="side" href="/elvar-athlete" aria-label="Elvar Athlete">
      <div class="logo">
        <div class="wordmark">EL<span class="v">V</span>AR</div>
        <div class="tag"><span class="line"></span><span class="word">ATHLETE</span><span class="line"></span></div>
        <div class="enter">Enter &rarr;</div>
      </div>
    </a>

    <div class="divider" aria-hidden="true"></div>

    <a class="side" href="/elvar-business" aria-label="Elvar Business">
      <div class="logo">
        <div class="wordmark">EL<span class="v">V</span>AR</div>
        <div class="tag"><span class="line"></span><span class="word">BUSINESS</span><span class="line"></span></div>
        <div class="enter">Enter &rarr;</div>
      </div>
    </a>
  </main>

  <footer>
    <a href="mailto:mike@elvarstrategyfirm.com?subject=Looking%20to%20Partner">Email Elvar</a>
    <a href="https://www.instagram.com/elvarmindset" target="_blank" rel="noopener">Instagram</a>
    <a href="/terms-and-conditions">Terms</a>
    <a href="/privacy-policy">Privacy</a>
    <div class="credit">Prepared by Michael Chaves Jr.</div>
  </footer>
</body>
</html>
